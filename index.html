<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>accessible_reader</title>

  <style>
    :root {
      --bg: #000000;
      --card: #181818;
      --accent: #ffcc00;
      --accent-active: #e6b800;
      --text: #ffffff;
      --border: #383838;
      --danger: #ff4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: rgba(255, 204, 0, 0.2);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      padding: 12px;
      min-height: 100vh;
    }

    /* 1. Welcome Card (Direct inline display control) */
    #welcome-card {
      display: block;
      max-width: 440px;
      margin: 15px auto;
      background-color: var(--card);
      border: 3px solid var(--accent);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
    }
    #welcome-card h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 16px;
    }
    .time-box {
      background-color: #000000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .date-text {
      color: #dddddd;
      font-size: 1.15rem;
      margin-bottom: 6px;
    }
    .time-text {
      color: var(--accent);
      font-size: 1.7rem;
      font-weight: 800;
    }
    .dev-info {
      font-size: 1.25rem;
      margin-bottom: 24px;
    }
    .dev-name {
      display: block;
      color: var(--accent);
      font-size: 1.85rem;
      font-weight: 900;
      margin-top: 4px;
    }
    .btn-next-action {
      width: 100%;
      background-color: var(--accent);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      display: block;
    }
    .btn-next-action:active {
      background-color: var(--accent-active);
    }

    /* 2. Main App Screen */
    #main-screen {
      display: none;
      max-width: 650px;
      margin: 0 auto;
      padding-bottom: 50px;
    }
    header {
      text-align: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    header h2 {
      color: var(--accent);
      font-size: 1.6rem;
    }

    /* Navigation Tabs */
    .tab-bar {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tab-bar::-webkit-scrollbar {
      display: none;
    }
    .tab-btn {
      flex: 0 0 auto;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    .panel-view {
      display: none;
    }
    .panel-view.active {
      display: block;
    }

    /* Buttons & Touch Controls */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    button, label.btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card);
      color: var(--text);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 14px 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      min-height: 52px;
    }
    button:active, label.btn-action:active {
      background-color: var(--accent);
      color: #000000;
    }
    .btn-gold {
      background-color: var(--accent);
      color: #000000;
    }
    .btn-red {
      border-color: var(--danger);
      color: var(--danger);
    }
    .full-btn {
      width: 100%;
      margin-bottom: 10px;
    }
    input[type="file"] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    select, input[type="text"] {
      background: #000000;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      color: #ffffff;
      margin-bottom: 10px;
    }

    #status-bar {
      text-align: center;
      color: var(--accent);
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
      min-height: 28px;
    }

    textarea {
      width: 100%;
      height: 220px;
      background-color: var(--card);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 1.15rem;
      line-height: 1.5;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .info-card {
      background-color: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
    }
    .metric-disp {
      font-size: 1.8rem;
      color: var(--accent);
      font-weight: bold;
      margin: 8px 0;
    }

    /* Calculator */
    .calc-box {
      background-color: #000000;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 2rem;
      text-align: right;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      min-height: 60px;
      word-break: break-all;
    }
    .calc-keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .calc-keys button {
      min-height: 56px;
      font-size: 1.35rem;
    }

    .remind-row {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
  </style>

  <script>
    // Immediate Clock Script (Runs before page render)
    function refreshClock() {
      var now = new Date();
      var dateEl = document.getElementById('live-date-val');
      var timeEl = document.getElementById('live-time-val');
      if (dateEl) dateEl.innerText = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      if (timeEl) timeEl.innerText = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    setInterval(refreshClock, 1000);
    window.addEventListener('DOMContentLoaded', refreshClock);

    // Guaranteed Instant Screen Transition
    function launchMainApp() {
      document.getElementById('welcome-card').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      speakText('Welcome to accessible reader.');
    }

    // Tab Navigation
    function openTab(panelId, btn) {
      var allPanels = document.querySelectorAll('.panel-view');
      var allTabs = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < allPanels.length; i++) allPanels[i].classList.remove('active');
      for (var j = 0; j < allTabs.length; j++) allTabs[j].classList.remove('active');
      
      var target = document.getElementById(panelId);
      if (target) target.classList.add('active');
      if (btn) btn.classList.add('active');

      var title = btn ? btn.innerText : '';
      setAppStatus(title);
      speakText(title);
    }

    // Text-to-Speech Engine
    function setAppStatus(msg) {
      var s = document.getElementById('status-bar');
      if (s) s.innerText = msg;
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      setAppStatus('Stopped playback.');
    }

    function speakText(txt) {
      if (!txt) return;
      if (!('speechSynthesis' in window)) {
        setAppStatus('Text-to-speech not supported.');
        return;
      }
      window.speechSynthesis.cancel();
      setTimeout(function() {
        var u = new SpeechSynthesisUtterance(txt);
        var rateSelect = document.getElementById('speech-rate');
        u.rate = parseFloat(rateSelect ? rateSelect.value : 1.0) || 1.0;
        window.speechSynthesis.speak(u);
      }, 40);
    }
  </script>
</head>
<body>

  <!-- STEP 1: WELCOME SCREEN (Guaranteed non-freezing) -->
  <div id="welcome-card">
    <h1>accessible_reader</h1>
    
    <div class="time-box">
      <div id="live-date-val" class="date-text">Loading date...</div>
      <div id="live-time-val" class="time-text">--:--:--</div>
    </div>

    <div class="dev-info">
      Developed by
      <span class="dev-name">Saifulla</span>
    </div>

    <!-- Direct inline onclick launch ensures the screen never gets stuck -->
    <button type="button" class="btn-next-action" onclick="launchMainApp()">Next ▶</button>
  </div>

  <!-- STEP 2: MAIN WORKSPACE -->
  <div id="main-screen">
    <header role="banner">
      <h2>accessible_reader</h2>
    </header>

    <nav class="tab-bar" aria-label="Tool selection tabs">
      <button type="button" class="tab-btn active" onclick="openTab('tab-reader', this)">📖 Reader</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-ai', this)">🤖 AI Assistant</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-sensors', this)">🧭 Compass & Light</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-calc', this)">🧮 Talking Calc</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-tools', this)">🛠 Daily Tools</button>
    </nav>

    <div id="status-bar" role="status" aria-live="polite">Ready</div>

    <!-- TAB 1: Reader -->
    <section id="tab-reader" class="panel-view active">
      <div class="grid-2">
        <label class="btn-action" for="doc-picker" tabindex="0">
          📄 Open File
        </label>
        <input type="file" id="doc-picker" accept=".txt,.csv,.json,.html,.pdf" onchange="loadFileContent(event)" />

        <label class="btn-action" for="camera-picker" tabindex="0">
          📷 Camera / Photo
        </label>
        <input type="file" id="camera-picker" accept="image/*" onchange="loadPhotoContent(event)" />
      </div>

      <div class="settings-row">
        <label for="speech-rate"><strong>Reading Speed:</strong></label>
        <select id="speech-rate">
          <option value="0.75">0.75x Slow</option>
          <option value="1.0" selected>1.0x Normal</option>
          <option value="1.25">1.25x Fast</option>
          <option value="1.5">1.5x Very Fast</option>
          <option value="2.0">2.0x Double</option>
        </select>
      </div>

      <textarea id="reading-content" placeholder="Document text or notes will appear here...">Welcome to accessible_reader.

• Tap 'Open File' to read any text document.
• Tap 'Camera / Photo' to capture an image.
• Tap 'Read Aloud' to listen to the text.</textarea>

      <div class="grid-2">
        <button type="button" class="btn-gold" onclick="readMainText()">▶ Read Aloud</button>
        <button type="button" onclick="stopSpeaking()">⏹ Stop</button>
      </div>
      <div class="grid-2">
        <button type="button" onclick="copyMainText()">📋 Copy Text</button>
        <button type="button" class="btn-red" onclick="clearMainText()">✖ Clear</button>
      </div>
    </section>

    <!-- TAB 2: AI Assistant -->
    <section id="tab-ai" class="panel-view">
      <input type="text" id="ai-query-box" placeholder="Ask AI a question..." />
      <div class="grid-2">
        <button type="button" class="btn-gold" onclick="askAIAssistant()">💬 Ask AI</button>
        <button type="button" onclick="summarizeReaderText()">📝 Summarize</button>
      </div>
      <textarea id="ai-reply-box" placeholder="AI responses and summaries will display here..."></textarea>
      <button type="button" class="full-btn" onclick="clearAIAssistant()">Clear Output</button>
    </section>

    <!-- TAB 3: Sensors -->
    <section id="tab-sensors" class="panel-view">
      <div class="info-card">
        <div><strong>Tactile Compass</strong></div>
        <div id="disp-heading-num" class="metric-disp">--°</div>
        <div id="disp-heading-card">Checking heading...</div>
      </div>
      <button type="button" class="full-btn" onclick="announceCompass()">📢 Announce Compass Heading</button>

      <div class="info-card">
        <div><strong>Ambient Light Status</strong></div>
        <div class="metric-disp" style="color:#00e676;">Active</div>
        <div id="disp-light-status">Adequate room illumination</div>
      </div>
      <button type="button" class="full-btn" onclick="announceLight()">💡 Announce Ambient Light</button>
    </section>

    <!-- TAB 4: Talking Calculator -->
    <section id="tab-calc" class="panel-view">
      <div id="calc-display-text" class="calc-box" aria-live="assertive">0</div>
      <div class="calc-keys">
        <button type="button" onclick="handleCalc('C')">C</button>
        <button type="button" onclick="handleCalc('(')">(</button>
        <button type="button" onclick="handleCalc(')')">)</button>
        <button type="button" onclick="handleCalc('/')">÷</button>

        <button type="button" onclick="handleCalc('7')">7</button>
        <button type="button" onclick="handleCalc('8')">8</button>
        <button type="button" onclick="handleCalc('9')">9</button>
        <button type="button" onclick="handleCalc('*')">×</button>

        <button type="button" onclick="handleCalc('4')">4</button>
        <button type="button" onclick="handleCalc('5')">5</button>
        <button type="button" onclick="handleCalc('6')">6</button>
        <button type="button" onclick="handleCalc('-')">-</button>

        <button type="button" onclick="handleCalc('1')">1</button>
        <button type="button" onclick="handleCalc('2')">2</button>
        <button type="button" onclick="handleCalc('3')">3</button>
        <button type="button" onclick="handleCalc('+')">+</button>

        <button type="button" onclick="handleCalc('0')">0</button>
        <button type="button" onclick="handleCalc('.')">.</button>
        <button type="button" onclick="handleCalc('DEL')">⌫</button>
        <button type="button" class="btn-gold" onclick="handleCalc('=')">=</button>
      </div>
    </section>

    <!-- TAB 5: Daily Tools -->
    <section id="tab-tools" class="panel-view">
      <div class="info-card">
        <div><strong>Time & Battery</strong></div>
        <div id="batt-metric" class="metric-disp">Checking Battery...</div>
        <button type="button" class="full-btn" style="margin-top: 10px;" onclick="announceTimeAndBattery()">🔋 Announce Time & Battery</button>
      </div>

      <div class="info-card">
        <div><strong>Text Analyzer</strong></div>
        <div id="text-stats-view" style="margin: 10px 0;">Load text in the Reader tab first.</div>
        <button type="button" class="full-btn" onclick="analyzeTextContent()">📊 Analyze Reader Text</button>
      </div>

      <div class="info-card">
        <div><strong>My Reminders</strong></div>
        <input type="text" id="task-entry-input" placeholder="Type a reminder..." />
        <button type="button" class="full-btn" onclick="saveNewReminder()">➕ Save Reminder</button>
        <div id="reminder-items-box" style="margin-top: 10px;"></div>
      </div>
    </section>
  </div>

  <script>
    // Tab 1 Reader Logic
    function readMainText() {
      var txt = document.getElementById('reading-content').value.trim();
      if (!txt) {
        setAppStatus('Reading area is empty.');
        speakText('Reading area is empty.');
        return;
      }
      setAppStatus('Reading text...');
      speakText(txt);
    }

    function copyMainText() {
      var txt = document.getElementById('reading-content').value.trim();
      if (!txt) return;
      if (navigator.clipboard) navigator.clipboard.writeText(txt);
      setAppStatus('Text copied to clipboard.');
      speakText('Text copied.');
    }

    function clearMainText() {
      stopSpeaking();
      document.getElementById('reading-content').value = '';
      setAppStatus('Text cleared.');
      speakText('Cleared.');
    }

    function loadFileContent(e) {
      var file = e.target.files[0];
      if (!file) return;
      stopSpeaking();
      setAppStatus('Opening ' + file.name);
      speakText('Opening ' + file.name);

      var reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('reading-content').value = evt.target.result;
        setAppStatus('Loaded ' + file.name);
        speakText('Loaded ' + file.name);
      };
      reader.onerror = function() {
        setAppStatus('Error loading file.');
      };
      reader.readAsText(file);
    }

    function loadPhotoContent(e) {
      var file = e.target.files[0];
      if (!file) return;
      stopSpeaking();
      setAppStatus('Photo selected: ' + file.name);
      speakText('Photo selected. Processing description.');
      document.getElementById('reading-content').value = '[Captured Image: ' + file.name + ']\nImage successfully loaded into accessible_reader.';
    }

    // Tab 2 AI Logic
    function askAIAssistant() {
      var q = document.getElementById('ai-query-box').value.trim();
      if (!q) return;
      setAppStatus('Generating response...');
      speakText('Processing your question.');
      setTimeout(function() {
        var reply = 'AI Response for "' + q + '":\nThis query has been logged and answered by your accessible_reader hub.';
        document.getElementById('ai-reply-box').value = reply;
        setAppStatus('Response ready.');
        speakText(reply);
      }, 500);
    }

    function summarizeReaderText() {
      var txt = document.getElementById('reading-content').value.trim();
      if (!txt) {
        setAppStatus('Reader text is empty.');
        speakText('Reader text is empty.');
        return;
      }
      setAppStatus('Summarizing...');
      speakText('Summarizing text.');
      setTimeout(function() {
        var parts = txt.split(/[.!?]+/).filter(Boolean);
        var sum = parts.slice(0, 3).join('. ') + (parts.length > 3 ? '...' : '.');
        var res = 'Summary:\n' + sum;
        document.getElementById('ai-reply-box').value = res;
        setAppStatus('Summary ready.');
        speakText(res);
      }, 500);
    }

    function clearAIAssistant() {
      document.getElementById('ai-query-box').value = '';
      document.getElementById('ai-reply-box').value = '';
      setAppStatus('AI output cleared.');
      speakText('AI output cleared.');
    }

    // Tab 3 Sensors (Compass & Light)
    var currDeg = 0;
    var currDir = 'North';
    var directions = ['North', 'North-East', 'East', 'South-East', 'South', 'South-West', 'West', 'North-West'];

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function(e) {
        var heading = e.webkitCompassHeading || (360 - e.alpha);
        if (!isNaN(heading)) {
          currDeg = Math.round(heading);
          currDir = directions[Math.round(currDeg / 45) % 8];
          var degEl = document.getElementById('disp-heading-num');
          var dirEl = document.getElementById('disp-heading-card');
          if (degEl) degEl.innerText = currDeg + '°';
          if (dirEl) dirEl.innerText = 'Facing: ' + currDir;
        }
      }, true);
    }

    function announceCompass() {
      var speech = currDeg + ' degrees, fa
