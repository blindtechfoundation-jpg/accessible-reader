<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>accessible_reader</title>

  <!-- Core AI & PDF Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #181818;
      --accent: #ffcc00;
      --accent-active: #e6b800;
      --text: #ffffff;
      --border: #383838;
      --danger: #ff4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: rgba(255, 204, 0, 0.2);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      padding: 12px;
      min-height: 100vh;
    }

    /* 1. Welcome Card */
    #welcome-card {
      display: block;
      max-width: 440px;
      margin: 15px auto;
      background-color: var(--card);
      border: 3px solid var(--accent);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
    }
    #welcome-card h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 16px; }
    .time-box { background-color: #000000; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 20px; }
    .date-text { color: #dddddd; font-size: 1.15rem; margin-bottom: 6px; }
    .time-text { color: var(--accent); font-size: 1.7rem; font-weight: 800; }
    .dev-info { font-size: 1.25rem; margin-bottom: 24px; }
    .dev-name { display: block; color: var(--accent); font-size: 1.85rem; font-weight: 900; margin-top: 4px; }
    
    .btn-next-action {
      width: 100%;
      background-color: var(--accent);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
      display: block;
    }
    .btn-next-action:active { background-color: var(--accent-active); }

    /* 2. Main App Screen */
    #main-screen {
      display: none;
      max-width: 650px;
      margin: 0 auto;
      padding-bottom: 50px;
    }
    header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 12px; }
    header h2 { color: var(--accent); font-size: 1.6rem; }

    /* Tabs */
    .tab-bar { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 0 0 auto; background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #000000; border-color: var(--accent); }

    .panel-view { display: none; }
    .panel-view.active { display: block; }

    /* Controls */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    button, label.btn-action {
      display: flex; align-items: center; justify-content: center;
      background-color: var(--card); color: var(--text);
      border: 2px solid var(--accent); border-radius: 8px;
      padding: 14px 8px; font-size: 1.05rem; font-weight: bold;
      cursor: pointer; text-align: center; min-height: 52px;
    }
    button:active, label.btn-action:active { background-color: var(--accent); color: #000000; }
    .btn-gold { background-color: var(--accent); color: #000000; }
    .btn-red { border-color: var(--danger); color: var(--danger); }
    .full-btn { width: 100%; margin-bottom: 10px; }
    input[type="file"] { display: none; }

    .settings-row { display: flex; align-items: center; justify-content: space-between; background-color: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
    select, input[type="text"] { background: #000000; color: var(--accent); border: 1px solid var(--accent); padding: 8px 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; }
    input[type="text"] { width: 100%; color: #ffffff; margin-bottom: 10px; }

    #status-bar { text-align: center; color: var(--accent); font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; min-height: 28px; }

    textarea { width: 100%; height: 220px; background-color: var(--card); color: var(--text); border: 2px solid var(--border); border-radius: 8px; padding: 12px; font-size: 1.15rem; line-height: 1.5; resize: vertical; margin-bottom: 12px; }
    textarea:focus { outline: none; border-color: var(--accent); }

    .info-card { background-color: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; text-align: center; }
    .metric-disp { font-size: 1.8rem; color: var(--accent); font-weight: bold; margin: 8px 0; }

    /* Calculator */
    .calc-box { background-color: #000000; border: 2px solid var(--accent); color: var(--accent); font-size: 2rem; text-align: right; padding: 14px; border-radius: 8px; margin-bottom: 12px; min-height: 60px; word-break: break-all; }
    .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .calc-keys button { min-height: 56px; font-size: 1.35rem; }

    .remind-row { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; text-align: left; }
  </style>

  <script>
    // 1. CLOCK ENGINE
    function refreshClock() {
      const now = new Date();
      const dateEl = document.getElementById('live-date-val');
      const timeEl = document.getElementById('live-time-val');
      if (dateEl) dateEl.innerText = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      if (timeEl) timeEl.innerText = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    setInterval(refreshClock, 1000);
    window.addEventListener('DOMContentLoaded', refreshClock);

    function launchMainApp() {
      document.getElementById('welcome-card').style.display = 'none';
      document.getElementById('main-screen').style.display = 'block';
      speakText('Welcome to accessible reader.');
    }

    function openTab(panelId, btn) {
      document.querySelectorAll('.panel-view').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      document.getElementById(panelId).classList.add('active');
      btn.classList.add('active');
      setAppStatus(btn.innerText);
      speakText(btn.innerText);
    }

    function setAppStatus(msg) {
      document.getElementById('status-bar').innerText = msg;
    }

    // 2. UNIVERSAL TEXT-TO-SPEECH (With Cloud Fallback for Android WebView)
    let audioQueue = [];
    let currentCloudAudio = null;

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentCloudAudio) {
        currentCloudAudio.pause();
        currentCloudAudio = null;
      }
      audioQueue = [];
      setAppStatus('Stopped playback.');
    }

    function playCloudAudio() {
      if (audioQueue.length === 0) {
        setAppStatus('Finished reading.');
        return;
      }
      const url = audioQueue.shift();
      currentCloudAudio = new Audio(url);
      currentCloudAudio.onended = playCloudAudio;
      currentCloudAudio.onerror = playCloudAudio; 
      currentCloudAudio.play();
    }

    function speakText(txt) {
      if (!txt) return;
      stopSpeaking();

      // Check if native Android speech is available and functioning
      if ('speechSynthesis' in window && typeof window.speechSynthesis.speak === 'function' && window.speechSynthesis.getVoices().length > 0) {
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(txt);
          const rateSelect = document.getElementById('speech-rate');
          u.rate = parseFloat(rateSelect ? rateSelect.value : 1.0) || 1.0;
          window.speechSynthesis.speak(u);
        }, 50);
      } else {
        // FALLBACK: Use Cloud Audio Stream for Android WebView Blocks
        const chunks = txt.match(/.{1,150}(\s|$)|.{1,150}/g) || [txt];
        audioQueue = chunks.map(c => `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(c.trim())}`);
        playCloudAudio();
      }
    }
  </script>
</head>
<body>

  <!-- WELCOME SCREEN -->
  <div id="welcome-card">
    <h1>accessible_reader</h1>
    <div class="time-box">
      <div id="live-date-val" class="date-text">Loading date...</div>
      <div id="live-time-val" class="time-text">--:--:--</div>
    </div>
    <div class="dev-info">Developed by <span class="dev-name">Saifulla</span></div>
    <button type="button" class="btn-next-action" onclick="launchMainApp()">Next ▶</button>
  </div>

  <!-- MAIN APP -->
  <div id="main-screen">
    <header role="banner"><h2>accessible_reader</h2></header>
    <nav class="tab-bar">
      <button type="button" class="tab-btn active" onclick="openTab('tab-reader', this)">📖 Reader</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-ai', this)">🤖 AI Assistant</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-sensors', this)">🧭 Sensors</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-calc', this)">🧮 Calculator</button>
      <button type="button" class="tab-btn" onclick="openTab('tab-tools', this)">🛠 Tools</button>
    </nav>
    <div id="status-bar" role="status" aria-live="polite">Ready</div>

    <!-- TAB 1: Reader & OCR -->
    <section id="tab-reader" class="panel-view active">
      <div class="grid-2">
        <label class="btn-action" for="doc-picker" tabindex="0">📄 Open PDF/Text</label>
        <input type="file" id="doc-picker" accept=".txt,.csv,.json,.html,.pdf" onchange="loadFileContent(event)" />
        <label class="btn-action" for="camera-picker" tabindex="0">📷 Scan Photo</label>
        <input type="file" id="camera-picker" accept="image/*" onchange="loadPhotoContent(event)" />
      </div>

      <div class="settings-row">
        <label for="speech-rate"><strong>Reading Speed:</strong></label>
        <select id="speech-rate">
          <option value="1.0" selected>1.0x Normal</option>
          <option value="1.5">1.5x Fast</option>
        </select>
      </div>

      <textarea id="reading-content" placeholder="Document text will appear here..."></textarea>

      <div class="grid-2">
        <button type="button" class="btn-gold" onclick="readMainText()">▶ Read Aloud</button>
        <button type="button" onclick="stopSpeaking()">⏹ Stop</button>
      </div>
      <div class="grid-2">
        <button type="button" onclick="copyMainText()">📋 Copy Text</button>
        <button type="button" class="btn-red" onclick="clearMainText()">✖ Clear</button>
      </div>
    </section>

    <!-- TAB 2: AI Assistant -->
    <section id="tab-ai" class="panel-view">
      <input type="text" id="ai-query-box" placeholder="Ask AI a question..." />
      <div class="grid-2">
        <button type="button" class="btn-gold" onclick="askAIAssistant()">💬 Ask AI</button>
        <button type="button" onclick="summarizeReaderText()">📝 Summarize</button>
      </div>
      <textarea id="ai-reply-box" placeholder="AI responses..."></textarea>
      <button type="button" class="full-btn" onclick="document.getElementById('ai-reply-box').value=''; setAppStatus('Cleared.')">Clear Output</button>
    </section>

    <!-- TAB 3: Sensors -->
    <section id="tab-sensors" class="panel-view">
      <div class="info-card">
        <div><strong>Tactile Compass</strong></div>
        <div id="disp-heading-num" class="metric-disp">--°</div>
        <div id="disp-heading-card">Checking heading...</div>
      </div>
      <button type="button" class="full-btn" onclick="speakText(document.getElementById('disp-heading-num').innerText + ' ' + document.getElementById('disp-heading-card').innerText)">📢 Announce Compass</button>
    </section>

    <!-- TAB 4: Calculator -->
    <section id="tab-calc" class="panel-view">
      <div id="calc-display-text" class="calc-box">0</div>
      <div class="calc-keys">
        <button type="button" onclick="handleCalc('C')">C</button>
        <button type="button" onclick="handleCalc('(')">(</button>
        <button type="button" onclick="handleCalc(')')">)</button>
        <button type="button" onclick="handleCalc('/')">÷</button>
        <button type="button" onclick="handleCalc('7')">7</button>
        <button type="button" onclick="handleCalc('8')">8</button>
        <button type="button" onclick="handleCalc('9')">9</button>
        <button type="button" onclick="handleCalc('*')">×</button>
        <button type="button" onclick="handleCalc('4')">4</button>
        <button type="button" onclick="handleCalc('5')">5</button>
        <button type="button" onclick="handleCalc('6')">6</button>
        <button type="button" onclick="handleCalc('-')">-</button>
        <button type="button" onclick="handleCalc('1')">1</button>
        <button type="button" onclick="handleCalc('2')">2</button>
        <button type="button" onclick="handleCalc('3')">3</button>
        <button type="button" onclick="handleCalc('+')">+</button>
        <button type="button" onclick="handleCalc('0')">0</button>
        <button type="button" onclick="handleCalc('.')">.</button>
        <button type="button" onclick="handleCalc('DEL')">⌫</button>
        <button type="button" class="btn-gold" onclick="handleCalc('=')">=</button>
      </div>
    </section>

    <!-- TAB 5: Tools -->
    <section id="tab-tools" class="panel-view">
      <div class="info-card">
        <div><strong>Time & Battery</strong></div>
        <div id="batt-metric" class="metric-disp">Checking Battery...</div>
        <button type="button" class="full-btn" style="margin-top: 10px;" onclick="announceTimeAndBattery()">🔋 Announce Time & Battery</button>
      </div>
    </section>
  </div>

  <script>
    // DOCUMENT PARSERS (PDF & OCR Restored)
    async function loadFileContent(e) {
      const file = e.target.files[0];
      if (!file) return;
      stopSpeaking();
      const fname = file.name.toLowerCase();

      if (fname.endsWith('.pdf')) {
        setAppStatus('Parsing PDF... please wait.');
        speakText('Parsing PDF document.');
        const fr = new FileReader();
        fr.onload = async function() {
          try {
            if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(this.result) }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              setAppStatus(`Extracting page ${i} of ${pdf.numPages}...`);
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              fullText += content.items.map(it => it.str).join(' ') + '\n\n';
            }
            document.getElementById('reading-content').value = fullText.trim() || 'No text found in PDF.';
            setAppStatus('PDF loaded successfully.');
            speakText(`Loaded PDF with ${pdf.numPages} pages.`);
          } catch (err) { setAppStatus('Failed to read PDF.'); }
        };
        fr.readAsArrayBuffer(file);
      } else {
        const fr = new FileReader();
        fr.onload = (evt) => { document.getElementById('reading-content').value = evt.target.result; setAppStatus('Loaded file.'); speakText('Loaded text file.'); };
        fr.readAsText(file);
      }
    }

    async function loadPhotoContent(e) {
      const file = e.target.files[0];
      if (!file) return;
      stopSpeaking();
      setAppStatus('Scanning Image OCR... Please wait.');
      speakText('Scanning image for text. Please wait.');

      try {
        const ocr = await Tesseract.recognize(file, 'eng', {
          logger: m => {
            if (m.status === 'recognizingtext') setAppStatus(`Scanning text: ${Math.round(m.progress * 100)}%`);
          }
        });
        const out = ocr.data.text.trim();
        if (out) {
          document.getElementById('reading-content').value = out;
          setAppStatus('OCR Scan Complete.');
          speakText('OCR scan complete. Reading extracted text.');
          speakText(out);
        } else {
          setAppStatus('No text found in image.');
          speakText('No text found in image.');
        }
      } catch (err) { setAppStatus('OCR failed.'); }
    }

    function readMainText() {
      const txt = document.getElementById('reading-content').value.trim();
      if (!txt) { speakText('Text is empty.'); return; }
      setAppStatus('Reading...');
      speakText(txt);
    }

    function copyMainText() {
      const txt = document.getElementById('reading-content').value;
      if (txt && navigator.clipboard) navigator.clipboard.writeText(txt);
      setAppStatus('Copied.'); speakText('Text copied.');
    }
    
    function clearMainText() {
      document.getElementById('reading-content').value = '';
      stopSpeaking();
      setAppStatus('Cleared.'); speakText('Cleared.');
    }

    // AI LOGIC
    function askAIAssistant() {
      const q = document.getElementById('ai-query-box').value;
      if (!q) return;
      setAppStatus('Processing...'); speakText('Processing.');
      setTimeout(() => {
        const ans = `AI Answer for: "${q}"\nQuery logged by accessible_reader.`;
        document.getElementById('ai-reply-box').value = ans;
        setAppStatus('Ready.'); speakText(ans);
      }, 500);
    }
    function summarizeReaderText() {
      const txt = document.getElementById('reading-content').value;
      if (!txt) { speakText('Text is empty.'); return; }
      setAppStatus('Summarizing...'); speakText('Summarizing.');
      setTimeout(() => {
        const chunks = txt.split(/[.!?]+/).filter(Boolean);
        const sum = chunks.slice(0, 3).join('. ') + '.';
        document.getElementById('ai-reply-box').value = 'Summary:\n' + sum;
        setAppStatus('Ready.'); speakText('Summary: ' + sum);
      }, 500);
    }

    // COMPASS & CALC & BATTERY
    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function(e) {
        let deg = e.webkitCompassHeading || (360 - e.alpha);
        if (!isNaN(deg)) {
          const d = Math.round(deg);
          document.getElementById('disp-heading-num').innerText = d + '°';
          document.getElementById('disp-heading-card').innerText = ['North','North-East','East','South-East','South','South-West','West','North-West'][Math.round(d/45)%8];
        }
      }, true);
    }

    let cStr = '';
    function handleCalc(v) {
      const s = document.getElementById('calc-display-text');
      if (v==='C') { cStr=''; s.innerText='0'; speakText('Cleared'); }
      else if (v==='DEL') { cStr=cStr.slice(0,-1); s.innerText=cStr||'0'; speakText('Deleted'); }
      else if (v==='=') { try { const r=Function('"use strict"; return ('+cStr+')')(); s.innerText=r; cStr=String(r); speakText('Equals '+r); } catch(e){ s.innerText='Error'; cStr=''; speakText('Error'); } }
      else { cStr+=v; s.innerText=cStr; speakText(v==='*'?'multiply':v==='/'?'divide':v); }
    }

    let bStat = 'Battery available.';
    if ('getBattery' in navigator) navigator.getBattery().then(b => {
      const p = Math.round(b.level * 100);
      bStat = `Battery is at ${p} percent${b.charging ? ' and charging' : ''}.`;
      document.getElementById('batt-metric').innerText = `Battery: ${p}% ${b.charging ? '(Charging)' : ''}`;
    }).catch(()=>{});

    function a
