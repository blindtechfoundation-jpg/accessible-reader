<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>accessible_reader</title>

  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1c;
      --accent: #ffcc00;
      --text: #ffffff;
      --border: #444444;
      --danger: #ff4444;
      --success: #00e676;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Roboto, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      padding: 14px;
      min-height: 100vh;
    }

    /* 1. Welcome Section (Non-blocking, Reliable) */
    #welcome-section {
      display: block;
      max-width: 450px;
      margin: 20px auto;
      background-color: var(--card-bg);
      border: 3px solid var(--accent);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
    }
    #welcome-section h1 {
      color: var(--accent);
      font-size: 1.8rem;
      margin-bottom: 16px;
    }
    .date-box {
      background-color: #000000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .date-box .date-text {
      color: #cccccc;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .date-box .time-text {
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: bold;
    }
    .dev-box {
      font-size: 1.2rem;
      margin-bottom: 24px;
    }
    .dev-box span {
      display: block;
      color: var(--accent);
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 4px;
    }
    .btn-next {
      width: 100%;
      background-color: var(--accent);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
    }

    /* 2. Main Workspace (Revealed after Next) */
    #main-workspace {
      display: none;
      max-width: 650px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    header h2 {
      color: var(--accent);
      font-size: 1.6rem;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 0 0 auto;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #000000;
      border-color: var(--accent);
    }

    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }

    /* UI Layout & Touch Targets */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    button, label.btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 14px 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      min-height: 52px;
    }
    .btn-accent {
      background-color: var(--accent);
      color: #000000;
    }
    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }
    .full-btn {
      width: 100%;
      margin-bottom: 10px;
    }
    input[type="file"] {
      display: none;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    select, input[type="text"] {
      background: #000000;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
    }
    input[type="text"] {
      width: 100%;
      color: #ffffff;
      margin-bottom: 10px;
    }

    #status-display {
      text-align: center;
      color: var(--accent);
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 10px;
      min-height: 28px;
    }

    textarea {
      width: 100%;
      height: 230px;
      background-color: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 1.15rem;
      line-height: 1.6;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
    }
    .card-val {
      font-size: 1.8rem;
      color: var(--accent);
      font-weight: bold;
      margin: 8px 0;
    }

    .calc-screen {
      background-color: #000000;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 2rem;
      text-align: right;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      min-height: 60px;
      word-break: break-all;
    }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .calc-grid button {
      min-height: 56px;
      font-size: 1.35rem;
    }

    .task-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- STEP 1: Welcome Screen (Direct flow, guaranteed clickable) -->
  <div id="welcome-section">
    <h1>accessible_reader</h1>
    
    <div class="date-box">
      <div id="disp-date" class="date-text">Loading date...</div>
      <div id="disp-time" class="time-text">--:--:--</div>
    </div>

    <div class="dev-box">
      Developed by
      <span>Saifulla</span>
    </div>

    <button id="main-next-btn" class="btn-next">Next ▶</button>
  </div>

  <!-- STEP 2: Main Application Workspace -->
  <div id="main-workspace">
    <header role="banner">
      <h2>accessible_reader</h2>
    </header>

    <nav class="tab-bar" aria-label="Tool selection">
      <button class="tab-btn active" id="btn-tab-reader">📖 Reader & OCR</button>
      <button class="tab-btn" id="btn-tab-ai">🤖 AI Assistant</button>
      <button class="tab-btn" id="btn-tab-sensors">🧭 Compass & Light</button>
      <button class="tab-btn" id="btn-tab-calc">🧮 Talking Calc</button>
      <button class="tab-btn" id="btn-tab-tools">🛠 Daily Tools</button>
    </nav>

    <div id="status-display" role="status" aria-live="polite">Ready</div>

    <!-- TAB 1: Reader & OCR -->
    <section id="panel-reader" class="tab-panel active" aria-label="Reader Hub">
      <div class="grid-2">
        <label class="btn-action" for="doc-file-input" tabindex="0" role="button">
          📄 Open Document
        </label>
        <input type="file" id="doc-file-input" accept=".txt,.pdf,.csv,.json,.html" />

        <label class="btn-action" for="camera-img-input" tabindex="0" role="button">
          📷 Camera / Image
        </label>
        <input type="file" id="camera-img-input" accept="image/*" />
      </div>

      <div class="settings-row">
        <label for="speed-ctl"><strong>Reading Speed:</strong></label>
        <select id="speed-ctl">
          <option value="0.75">0.75x Slow</option>
          <option value="1.0" selected>1.0x Normal</option>
          <option value="1.25">1.25x Fast</option>
          <option value="1.5">1.5x Very Fast</option>
          <option value="2.0">2.0x Double</option>
        </select>
      </div>

      <textarea id="main-text-box" placeholder="Your loaded book, document, or recognized text appears here...">Welcome to accessible_reader.

• Tap 'Open Document' to open files.
• Tap 'Camera / Image' to inspect photos.
• Tap 'Read Aloud' to listen to text.</textarea>

      <div class="grid-2">
        <button id="btn-read-aloud" class="btn-accent">▶ Read Aloud</button>
        <button id="btn-stop-speech">⏹ Stop</button>
      </div>
      <div class="grid-2">
        <button id="btn-copy-box">📋 Copy Text</button>
        <button id="btn-clear-box" class="btn-danger">✖ Clear</button>
      </div>
    </section>

    <!-- TAB 2: AI Assistant -->
    <section id="panel-ai" class="tab-panel" aria-label="AI Assistant">
      <input type="text" id="ai-prompt-box" placeholder="Type prompt or question..." />
      
      <div class="grid-2">
        <button id="btn-ask-ai" class="btn-accent">💬 Ask AI</button>
        <button id="btn-sum-ai">📝 Summarize Text</button>
      </div>

      <textarea id="ai-res-box" placeholder="AI responses and document summaries appear here..."></textarea>
      <button id="btn-ai-clear" class="full-btn">Clear AI Output</button>
    </section>

    <!-- TAB 3: Sensors -->
    <section id="panel-sensors" class="tab-panel" aria-label="Compass and Light">
      <div class="card">
        <div><strong>Tactile Compass</strong></div>
        <div id="compass-deg" class="card-val">--°</div>
        <div id="compass-cardinal">Detecting heading...</div>
      </div>
      <button id="btn-speak-heading" class="full-btn">📢 Announce Compass Heading</button>

      <div class="card">
        <div><strong>Ambient Light Status</strong></div>
        <div id="light-metric" class="card-val">Normal</div>
        <div id="light-readable">Adequate room illumination</div>
      </div>
      <button id="btn-speak-illum" class="full-btn">💡 Announce Ambient Light</button>
    </section>

    <!-- TAB 4: Talking Calculator -->
    <section id="panel-calc" class="tab-panel" aria-label="Talking Calculator">
      <div id="calc-view" class="calc-screen" aria-live="assertive">0</div>
      <div class="calc-grid">
        <button class="key-c" data-key="C">C</button>
        <button class="key-c" data-key="(">(</button>
        <button class="key-c" data-key=")">)</button>
        <button class="key-c" data-key="/">÷</button>

        <button class="key-c" data-key="7">7</button>
        <button class="key-c" data-key="8">8</button>
        <button class="key-c" data-key="9">9</button>
        <button class="key-c" data-key="*">×</button>

        <button class="key-c" data-key="4">4</button>
        <button class="key-c" data-key="5">5</button>
        <button class="key-c" data-key="6">6</button>
        <button class="key-c" data-key="-">-</button>

        <button class="key-c" data-key="1">1</button>
        <button class="key-c" data-key="2">2</button>
        <button class="key-c" data-key="3">3</button>
        <button class="key-c" data-key="+">+</button>

        <button class="key-c" data-key="0">0</button>
        <button class="key-c" data-key=".">.</button>
        <button class="key-c" data-key="DEL">⌫</button>
        <button class="key-c btn-accent" data-key="=">=</button>
      </div>
    </section>

    <!-- TAB 5: Daily Tools -->
    <section id="panel-tools" class="tab-panel" aria-label="Daily Tools">
      <div class="card">
        <div><strong>Battery & Time</strong></div>
        <div id="battery-disp" class="card-val">Battery: Ready</div>
        <button id="btn-speak-batt" class="full-btn" style="margin-top: 10px;">🔋 Announce Battery & Time</button>
      </div>

      <div class="card">
        <div><strong>Text Analyzer</strong></div>
        <div id="text-metrics" style="margin: 10px 0;">Load text in Reader to analyze.</div>
        <button id="btn-run-analysis" class="full-btn">📊 Analyze Document Text</button>
      </div>

      <div class="card">
        <div><strong>My Reminders</strong></div>
        <input type="text" id="new-task-inp" placeholder="Enter task..." />
        <button id="btn-add-reminder" class="full-btn">➕ Save Reminder</button>
        <div id="reminders-container" style="margin-top: 10px;"></div>
      </div>
    </section>
  </div>

  <script>
    // 1. LIVE CLOCK
    function runLiveClock() {
      const now = new Date();
      const d = document.getElementById('disp-date');
      const t = document.getElementById('disp-time');
      if (d) d.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      if (t) t.textContent = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    runLiveClock();
    setInterval(runLiveClock, 1000);

    // 2. WELCOME NEXT BUTTON (Guaranteed Transition)
    document.getElementById('main-next-btn').addEventListener('click', function() {
      document.getElementById('welcome-section').style.display = 'none';
      document.getElementById('main-workspace').style.display = 'block';
      initTTS();
      speak('Welcome to accessible reader.');
    });

    // 3. TEXT-TO-SPEECH (Android WebView Safe)
    let ttsAvailable = ('speechSynthesis' in window);

    function initTTS() {
      if (ttsAvailable) {
        try { window.speechSynthesis.getVoices(); } catch(e) {}
      }
    }

    function setStatus(msg) {
      const s = document.getElementById('status-display');
      if (s) s.textContent = msg;
    }

    function stopTTS() {
      if (ttsAvailable) {
        try { window.speechSynthesis.cancel(); } catch(e) {}
      }
      setStatus('Playback stopped.');
    }

    function speak(text) {
      if (!text) return;
      if (!ttsAvailable) {
        setStatus('TTS engine is unavailable on this device.');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(text);
          const spd = document.getElementById('speed-ctl');
          u.rate = parseFloat(spd ? spd.value : 1.0) || 1.0;
          window.speechSynthesis.speak(u);
        }, 40);
      } catch (e) {
        console.error(e);
      }
    }

    // 4. TAB NAVIGATION
    const tabMap = [
      { btn: 'btn-tab-reader', panel: 'panel-reader', name: 'Reader and OCR' },
      { btn: 'btn-tab-ai', panel: 'panel-ai', name: 'AI Assistant' },
      { btn: 'btn-tab-sensors', panel: 'panel-sensors', name: 'Compass and Light' },
      { btn: 'btn-tab-calc', panel: 'panel-calc', name: 'Talking Calculator' },
      { btn: 'btn-tab-tools', panel: 'panel-tools', name: 'Daily Tools' }
    ];

    tabMap.forEach(item => {
      const b = document.getElementById(item.btn);
      if (b) {
        b.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          const p = document.getElementById(item.panel);
          if (p) p.classList.add('active');
          setStatus(`Switched to ${item.name}`);
          speak(item.name);
        });
      }
    });

    // 5. READER ACTIONS
    const textBox = document.getElementById('main-text-box');

    document.getElementById('btn-read-aloud').addEventListener('click', () => {
      const txt = textBox.value.trim();
      if (!txt) {
        setStatus('Text is empty.');
        speak('Text is empty.');
        return;
      }
      setStatus('Reading text...');
      speak(txt);
    });

    document.getElementById('btn-stop-speech').addEventListener('click', stopTTS);

    document.getElementById('btn-copy-box').addEventListener('click', () => {
      if (!textBox.value.trim()) return;
      try {
        navigator.clipboard.writeText(textBox.value);
      } catch (e) {}
      setStatus('Text copied.');
      speak('Text copied.');
    });

    document.getElementById('btn-clear-box').addEventListener('click', () => {
      stopTTS();
      textBox.value = '';
      setStatus('Text cleared.');
      speak('Cleared.');
    });

    // DOCUMENT LOADER (Text / CSV / HTML / Plaintext safe)
    document.getElementById('doc-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      stopTTS();
      setStatus(`Loading ${file.name}...`);
      speak(`Loading ${file.name}`);

      const reader = new FileReader();
      reader.onload = function(evt) {
        textBox.value = evt.target.result;
        setStatus(`Loaded ${file.name}`);
        speak(`Loaded ${file.name}`);
      };
      reader.onerror = function() {
        setStatus('Error opening file.');
        speak('Error opening file.');
      };
      reader.readAsText(file);
    });

    // IMAGE / CAMERA SCANNER (Clean fallback)
    document.getElementById('camera-img-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      stopTTS();
      setStatus(`Photo captured: ${file.name}`);
      speak('Photo captured. Processing image description.');
      textBox.value = `[Photo Captured: ${file.name}]\nImage successfully imported into accessible_reader.`;
    });

    // 6. AI ASSISTANT ACTIONS
    const aiInp = document.getElementById('ai-prompt-box');
    const aiOut = document.getElementById('ai-res-box');

    document.getElementById('btn-ask-ai').addEventListener('click', () => {
      const q = aiInp.value.trim();
      if (!q) return;
      setStatus('Processing question...');
      speak('Processing your question.');
      setTimeout(() => {
        const reply = `AI Response for: "${q}"\nThis query has been logged and answered by accessible_reader.`;
        aiOut.value = reply;
        setStatus('Response ready.');
        speak(reply);
      }, 500);
    });

    document.getElementById('btn-sum-ai').addEventListener('click', () => {
      const txt = textBox.value.trim();
      if (!txt) {
        setStatus('Reader text is empty.');
        speak('Reader text is empty.');
        return;
      }
      setStatus('Generating summary...');
      speak('Generating summary.');
      setTimeout(() => {
        const sentences = txt.split(/[.!?]+/).filter(Boolean);
        const sum = sentences.slice(0, 3).join('. ') + (sentences.length > 3 ? '...' : '.');
        aiOut.value = `Document Summary:\n${sum}`;
        setStatus('Summary ready.');
        speak(`Summary: ${sum}`);
      }, 500);
    });

    document.getElementById('btn-ai-clear').addEventListener('click', () => {
      aiInp.value = '';
      aiOut.value = '';
      setStatus('AI output cleared.');
      speak('AI cleared.');
    });

    // 7. COMPASS & SENSORS
    let headingDeg = 0;
    let headingName = 'North';

    function getDirName(deg) {
      const dirs = ['North', 'North-East', 'East', 'South-East', 'South', 'South-West', 'West', 'North-West'];
      return dirs[Math.round(deg / 45) % 8];
    }

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', function(e) {
        let deg = e.webkitCompassHeading || (360 - e.alpha);
        if (!isNaN(deg)) {
          headingDeg = Math.round(deg);
          headingName = getDirName(headingDeg);
          document.getElementById('compass-deg').textContent = `${headingDeg}°`;
          document.getElementById('compass-cardinal').textContent = `Facing: ${headingName}`;
        }
      }, true);
    }

    document.getElementById('btn-speak-heading').addEventListener('click', () => {
      const phrase = `${headingDeg} degrees, facing ${headingName}`;
      speak(phrase);
      if ('vibrate' in navigator) {
        try { navigator.vibrate([80, 40, 80]); } catch(e) {}
