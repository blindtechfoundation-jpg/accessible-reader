<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>accessible_reader</title>

  <!-- PDF & OCR Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #181818;
      --accent: #ffcc00;
      --accent-active: #e6b800;
      --text: #ffffff;
      --border: #383838;
      --danger: #ff4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: rgba(255, 204, 0, 0.2);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      padding: 12px;
      min-height: 100vh;
    }

    /* Welcome Card */
    #welcome-card {
      display: block;
      max-width: 440px;
      margin: 20px auto;
      background-color: var(--card);
      border: 3px solid var(--accent);
      border-radius: 14px;
      padding: 24px 18px;
      text-align: center;
    }
    #welcome-card h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 16px; }
    .time-box { background-color: #000000; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 20px; }
    .date-text { color: #dddddd; font-size: 1.15rem; margin-bottom: 6px; }
    .time-text { color: var(--accent); font-size: 1.7rem; font-weight: 800; }
    .dev-info { font-size: 1.25rem; margin-bottom: 24px; }
    .dev-name { display: block; color: var(--accent); font-size: 1.85rem; font-weight: 900; margin-top: 4px; }
    
    .btn-next-action {
      width: 100%;
      background-color: var(--accent);
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.45rem;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-next-action:active { background-color: var(--accent-active); }

    /* Main Hub Grid */
    #main-hub {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }
    header { text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 16px; }
    header h2 { color: var(--accent); font-size: 1.6rem; }
    
    .hub-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .hub-card {
      background-color: var(--card);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
    }
    .hub-card:active {
      background-color: var(--accent);
      color: #000000;
    }

    /* Dedicated Window Modals */
    .window-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #000000;
      z-index: 99999;
      overflow-y: auto;
      padding: 16px;
    }
    .window-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .window-title {
      color: var(--accent);
      font-size: 1.4rem;
      font-weight: bold;
    }
    .btn-close-window {
      background-color: var(--danger);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Shared UI Elements */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    button, label.btn-action {
      display: flex; align-items: center; justify-content: center;
      background-color: var(--card); color: var(--text);
      border: 2px solid var(--accent); border-radius: 8px;
      padding: 14px 8px; font-size: 1.05rem; font-weight: bold;
      cursor: pointer; text-align: center; min-height: 52px;
    }
    button:active, label.btn-action:active { background-color: var(--accent); color: #000000; }
    .btn-gold { background-color: var(--accent); color: #000000; }
    .btn-red { border-color: var(--danger); color: var(--danger); }
    .full-btn { width: 100%; margin-bottom: 10px; }
    input[type="file"] { display: none; }

    .settings-row { display: flex; align-items: center; justify-content: space-between; background-color: var(--card); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
    select, input[type="text"] { background: #000000; color: var(--accent); border: 1px solid var(--accent); padding: 8px 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; }
    input[type="text"] { width: 100%; color: #ffffff; margin-bottom: 10px; }

    #status-bar { text-align: center; color: var(--accent); font-weight: bold; font-size: 1.05rem; margin-bottom: 12px; min-height: 26px; }

    textarea { width: 100%; height: 220px; background-color: var(--card); color: var(--text); border: 2px solid var(--border); border-radius: 8px; padding: 12px; font-size: 1.15rem; line-height: 1.5; resize: vertical; margin-bottom: 12px; }
    
    .info-card { background-color: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; text-align: center; }
    .metric-disp { font-size: 1.8rem; color: var(--accent); font-weight: bold; margin: 8px 0; }
    
    .calc-box { background-color: #000000; border: 2px solid var(--accent); color: var(--accent); font-size: 2rem; text-align: right; padding: 14px; border-radius: 8px; margin-bottom: 12px; min-height: 60px; word-break: break-all; }
    .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .calc-keys button { min-height: 56px; font-size: 1.35rem; }
    .remind-row { padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; text-align: left; }
  </style>

  <script>
    // Initialize baseline history state on load
    window.addEventListener('DOMContentLoaded', function() {
      refreshClock();
      try {
        history.replaceState({ page: 'hub' }, '', '');
      } catch (e) {}
    });

    function refreshClock() {
      const now = new Date();
      const d = document.getElementById('live-date-val');
      const t = document.getElementById('live-time-val');
      if (d) d.innerText = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      if (t) t.innerText = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    setInterval(refreshClock, 1000);

    function launchMainHub() {
      document.getElementById('welcome-card').style.display = 'none';
      document.getElementById('main-hub').style.display = 'block';
      speakText('Welcome to accessible reader.');
    }

    let activeWindowId = null;

    function openWindow(windowId, title) {
      document.querySelectorAll('.window-modal').forEach(w => w.style.display = 'none');
      const target = document.getElementById(windowId);
      if (target) {
        target.style.display = 'block';
        activeWindowId = windowId;
        // Push state so back gesture closes modal instead of exiting app
        try {
          history.pushState({ modalOpen: true, id: windowId }, '', '');
        } catch (e) {}
        setAppStatus(title);
        speakText(title);
      }
    }

    function closeWindow(windowId) {
      stopSpeaking();
      const target = document.getElementById(windowId);
      if (target) {
        target.style.display = 'none';
        activeWindowId = null;
        setAppStatus('Ready');
        speakText('Closed window');
      }
    }

    // Bulletproof back-button interceptor
    window.addEventListener('popstate', function(event) {
      if (activeWindowId) {
        const modal = document.getElementById(activeWindowId);
        if (modal) {
          modal.style.display = 'none';
        }
        activeWindowId = null;
        stopSpeaking();
        setAppStatus('Ready');
        speakText('Closed window');
        // Push state back so app remains stable
        try {
          history.pushState({ page: 'hub' }, '', '');
        } catch (e) {}
      }
    });

    function setAppStatus(msg) {
      const s = document.getElementById('status-bar');
      if (s) s.innerText = msg;
    }

    let audioQueue = [];
    let currentCloudAudio = null;

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentCloudAudio) {
        currentCloudAudio.pause();
        currentCloudAudio = null;
      }
      audioQueue = [];
      setAppStatus('Stopped playback.');
    }

    function playCloudAudio() {
      if (audioQueue.length === 0) {
        setAppStatus('Finished reading.');
        return;
      }
      const url = audioQueue.shift();
      currentCloudAudio = new Audio(url);
      currentCloudAudio.onended = playCloudAudio;
      currentCloudAudio.onerror = playCloudAudio; 
      currentCloudAudio.play();
    }

    function speakText(txt) {
      if (!txt) return;
      stopSpeaking();
      if ('speechSynthesis' in window && typeof window.speechSynthesis.speak === 'function') {
        setTimeout(() => {
          const u = new SpeechSynthesisUtterance(txt);
          const rateSelect = document.getElementById('speech-rate');
          u.rate = parseFloat(rateSelect ? rateSelect.value : 1.0) || 1.0;
          window.speechSynthesis.speak(u);
        }, 50);
      } else {
        const chunks = txt.match(/.{1,150}(\s|$)|.{1,150}/g) || [txt];
        audioQueue = chunks.map(c => `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(c.trim())}`);
        playCloudAudio();
      }
    }
  </script>
</head>
<body>

  <!-- WELCOME SCREEN -->
  <div id="welcome-card">
    <h1>accessible_reader</h1>
    <div class="time-box">
      <div id="live-date-val" class="date-text">Loading date...</div>
      <div id="live-time-val" class="time-text">--:--:--</div>
    </div>
    <div class="dev-info">Developed by <span class="dev-name">Saifulla</span></div>
    <button type="button" class="btn-next-action" onclick="launchMainHub()">Next ▶</button>
  </div>

  <!-- MAIN HUB MENU -->
  <div id="main-hub">
    <header role="banner"><h2>accessible_reader</h2></header>
    <div id="status-bar" role="status" aria-live="polite">Ready</div>

    <div class="hub-grid">
      <button type="button" class="hub-card" onclick="openWindow('win-reader', 'Document & PDF Reader')">
        <span>📖 Reader & OCR</span> ▶
      </button>
      <button type="button" class="hub-card" onclick="openWindow('win-ai', 'AI Tech Assistant')">
        <span>🤖 AI Assistant</span> ▶
      </button>
      <button type="button" class="hub-card" onclick="openWindow('win-sensors', 'Tactile Compass & Light')">
        <span>🧭 Sensors & Compass</span> ▶
      </button>
      <button type="button" class="hub-card" onclick="openWindow('win-calc', 'Talking Calculator')">
        <span>🧮 Talking Calculator</span> ▶
      </button>
      <button type="button" class="hub-card" onclick="openWindow('win-tools', 'Daily Tools & Battery')">
        <span>🛠 Daily Tools & Reminders</span> ▶
      </button>
    </div>
  </div>


  <!-- ================= DEDICATED WINDOW 1: READER & OCR ================= -->
  <div id="win-reader" class="window-modal">
    <div class="window-header">
      <div class="window-title">📖 Reader & OCR</div>
      <button type="button" class="btn-close-window" onclick="closeWindow('win-reader')">✖ Close Window</button>
    </div>

    <div class="grid-2">
      <label class="btn-action" for="doc-picker" tabindex="0">📄 Open PDF/Text</label>
      <input type="file" id="doc-picker" accept=".txt,.csv,.json,.html,.pdf" onchange="loadFileContent(event)" />
      <label class="btn-action" for="camera-picker" tabindex="0">📷 Scan Photo</label>
      <input type="file" id="camera-picker" accept="image/*" onchange="loadPhotoContent(event)" />
    </div>

    <div class="settings-row">
      <label for="speech-rate"><strong>Speed:</strong></label>
      <select id="speech-rate">
        <option value="1.0" selected>1.0x Normal</option>
        <option value="1.5">1.5x Fast</option>
      </select>
    </div>

    <textarea id="reading-content" placeholder="Document text will appear here...">Welcome to accessible_reader.
• Tap 'Open PDF/Text' to load documents.
• Tap 'Scan Photo' to extract OCR text.
• Tap 'Read Aloud' to listen.</textarea>

    <div class="grid-2">
      <button type="button" class="btn-gold" onclick="readMainText()">▶ Read Aloud</button>
      <button type="button" onclick="stopSpeaking()">⏹ Stop</button>
    </div>
    <div class="grid-2">
      <button type="button" onclick="copyMainText()">📋 Copy Text</button>
      <button type="button" class="btn-red" onclick="clearMainText()">✖ Clear</button>
    </div>
  </div>


  <!-- ================= DEDICATED WINDOW 2: AI ASSISTANT ================= -->
  <div id="win-ai" class="window-modal">
    <div class="window-header">
      <div class="window-title">🤖 AI Assistant</div>
      <button type="button" class="btn-close-window" onclick="closeWindow('win-ai')">✖ Close Window</button>
    </div>

    <input type="text" id="ai-query-box" placeholder="Ask AI a question..." />
    <div class="grid-2">
      <button type="button" class="btn-gold" onclick="askAIAssistant()">💬 Ask AI</button>
      <button type="button" onclick="summarizeReaderText()">📝 Summarize Reader</button>
    </div>
    <textarea id="ai-reply-box" placeholder="AI responses..."></textarea>
    <button type="button" class="full-btn" onclick="document.getElementById('ai-reply-box').value=''; speakText('Cleared.')">Clear Output</button>
  </div>


  <!-- ================= DEDICATED WINDOW 3: SENSORS ================= -->
  <div id="win-sensors" class="window-modal">
    <div class="window-header">
      <div class="window-title">🧭 Compass & Sensors</div>
      <button type="button" class="btn-close-window" onclick="closeWindow('win-sensors')">✖ Close Window</button>
    </div>

    <div class="info-card">
      <div><strong>Tactile Compass</strong></div>
      <div id="disp-heading-num" class="metric-disp">--°</div>
      <div id="disp-heading-card">Checking heading...</div>
    </div>
    <button type="button" class="full-btn btn-gold" onclick="speakText(document.getElementById('disp-heading-num').innerText + ' ' + document.getElementById('disp-heading-card').innerText)">📢 Announce Compass</button>
  </div>


  <!-- ================= DEDICATED WINDOW 4: CALCULATOR ================= -->
  <div id="win-calc" class="window-modal">
    <div class="window-header">
      <div class="window-title">🧮 Talking Calculator</div>
      <button type="button" class="btn-close-window" onclick="closeWindow('win-calc')">✖ Close Window</button>
    </div>

    <div id="calc-display-text" class="calc-box">0</div>
    <div class="calc-keys">
      <button type="button" onclick="handleCalc('C')">C</button>
      <button type="button" onclick="handleCalc('(')">(</button>
      <button type="button" onclick="handleCalc(')')">)</button>
      <button type="button" onclick="handleCalc('/')">÷</button>
      <button type="button" onclick="handleCalc('7')">7</button>
      <button type="button" onclick="handleCalc('8')">8</button>
      <button type="button" onclick="handleCalc('9')">9</button>
      <button type="button" onclick="handleCalc('*')">×</button>
      <button type="button" onclick="handleCalc('4')">4</button>
      <button type="button" onclick="handleCalc('5')">5</button>
      <button type="button" onclick="handleCalc('6')">6</button>
      <button type="button" onclick="handleCalc('-')">-</button>
      <button type="button" onclick="handleCalc('1')">1</button>
      <button type="button" onclick="handleCalc('2')">2</button>
      <button type="button" onclick="handleCalc('3')">3</button>
      <button type="button" onclick="handleCalc('+')">+</button>
      <button type="button" onclick="handleCalc('0')">0</button>
      <button type="button" onclick="handleCalc('.')">.</button>
      <button type="button" onclick="handleCalc('DEL')">⌫</button>
      <button type="button" class="btn-gold" onclick="handleCalc('=')">=</button>
    </div>
  </div>


  <!-- ================= DEDICATED WINDOW 5: DAILY TOOLS ================= -->
  <div id="win-tools" class="window-modal">
    <div class="window-header">
      <div class="window-title">🛠 Daily Tools & Reminders</div>
      <button type="button" class="btn-close-window" onclick="closeWindow('win-tools')">✖ Close Window</button>
    </div>

    <div class="info-card">
      <div><strong>Time & Battery</strong></div>
      <div id="batt-metric" class="metric-disp">Checking Battery...</div>
      <button type="button" class="full-btn btn-gold" style="margin-top: 10px;" onclick="announceTimeAndBattery()">🔋 Announce Time & Battery</button>
    </div>

    <div class="info-card">
      <div><strong>My Reminders</strong></div>
      <input type="text" id="task-entry-input" placeholder="Type a reminder..." />
      <button type="button" class="full-btn btn-gold" onclick="saveNewReminder()">➕ Save Reminder</button>
      <div id="reminder-items-box" style="margin-top: 10px;"></div>
    </div>
  </div>


  <script>
    async function loadFileContent(e) {
      const file = e.target.files[0];
      if (!file) return;
      stopSpeaking();
      const fname = file.name.toLowerCase();

      if (fname.endsWith('.pdf')) {
        speakText('Parsing PDF document.');
        const fr = new FileReader();
        fr.onload = async function() {
          try {
            if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(this.result) }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              fullText += content.items.map(it => it.str).join(' ') + '\n\n';
            }
            document.getElementById('reading-content').value = fullText.trim() || 'No text found.';
            speakText(`Loaded PDF with ${pdf.numPages} pages.`);
          } catch (err) { speakText('Failed to read PDF.'); }
        };
        fr.readAsArrayBuffer(file);
      } else {
        const fr = new FileReader();
        fr.onload = (evt) => { document.getElementById('reading-content').value = evt.target.result; speakText('Loaded text file.'); };
        fr.readAsText(file);
      }
    }

    async function loadPhotoContent(e) {
      const file = e.target.files[0];
      if (!file) return;
      stopSpeaking();
      speakText('Scanning image for text.');
      try {
        const ocr = await Tesseract.recognize(file, 'eng');
        const out = ocr.data.text.trim();
        if (out) {
          document.getElementById('reading-content').value = out;
          speakText('OCR complete. Reading text.');
          speakText(out);
        } else { speakText('No text found in image.'); }
      } catch (err) { speakText('OCR failed.'); }
    }

    function readMainText() {
      const txt = document.getElementById('reading-content').value.trim();
      if (!txt) { speakText('Text is empty.'); return; }
      speakText(txt);
    }

    function copyMainText() {
      const txt = document.getElementByI
