<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible AI Reading & OCR Hub</title>
  
  <!-- PDF.js library for document parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Tesseract.js library for OCR text recognition -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #ffc107;
      --text-color: #ffffff;
      --border-color: #333333;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Full-screen Developer Welcome Modal */
    #welcome-modal {
      position: fixed;
      inset: 0;
      background-color: #0c0c0c;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }
    .modal-card {
      background-color: var(--card-bg);
      border: 2px solid var(--accent-color);
      border-radius: 16px;
      padding: 30px 20px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-title {
      font-size: 1.6rem;
      color: var(--accent-color);
      margin: 0 0 16px 0;
      font-weight: bold;
    }
    .datetime-container {
      background-color: #121212;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .date-text {
      font-size: 1.1rem;
      color: #eeeeee;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .time-text {
      font-size: 1.4rem;
      color: var(--accent-color);
      font-weight: bold;
    }
    .developer-box {
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 24px;
    }
    .developer-name {
      color: var(--accent-color);
      font-weight: bold;
      display: block;
      font-size: 1.6rem;
      margin-top: 4px;
    }
    .btn-next {
      background-color: var(--accent-color);
      color: #000000;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 16px 36px;
      width: 100%;
      cursor: pointer;
    }
    .btn-next:active {
      background-color: #e0a800;
    }

    /* Main App Interface (Initially hidden until Next is clicked) */
    #main-app {
      display: none;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent-color);
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    button, label.file-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--accent-color);
      padding: 14px 10px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    button:active, label.file-btn:active {
      background-color: var(--accent-color);
      color: #000000;
    }
    input[type="file"] {
      display: none;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    select {
      background: #000000;
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
    }
    #status {
      text-align: center;
      font-size: 1.05rem;
      color: var(--accent-color);
      margin-bottom: 10px;
      min-height: 28px;
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 300px;
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      font-size: 1.2rem;
      line-height: 1.6;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }
    .playback-bar {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .playback-bar button {
      flex: 1;
      padding: 16px;
      font-size: 1.15rem;
    }
    .btn-speak {
      background-color: var(--accent-color);
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- 1. Startup Developer Window -->
  <div id="welcome-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <h2 id="modal-title" class="modal-title">Accessible Reader</h2>
      
      <div class="datetime-container">
        <div id="current-date" class="date-text" aria-live="polite">Loading date...</div>
        <div id="current-time" class="time-text" aria-live="polite">--:--:--</div>
      </div>

      <div class="developer-box">
        Developed by
        <span class="developer-name">Saifulla</span>
      </div>

      <button id="btn-next" class="btn-next" aria-label="Next, open application">Next ▶</button>
    </div>
  </div>

  <!-- 2. Main Reader Hub Workspace -->
  <div id="main-app">
    <header role="banner">
      <h1>Accessible AI Reading & OCR Hub</h1>
    </header>

    <main role="main">
      <!-- Input Options -->
      <section class="controls-grid" aria-label="Document and Image tools">
        <label class="file-btn" for="doc-input" tabindex="0" role="button">
          📄 Open PDF / Book
        </label>
        <input type="file" id="doc-input" accept=".pdf,.txt,application/pdf,text/plain" />

        <label class="file-btn" for="img-input" tabindex="0" role="button">
          📷 Scan / OCR Image
        </label>
        <input type="file" id="img-input" accept="image/*" />
      </section>

      <!-- Speed & Font Bar -->
      <section class="settings-row" aria-label="Reading options">
        <label for="speed-select"><strong>Reading Speed:</strong></label>
        <select id="speed-select">
          <option value="0.75">0.75x Slow</option>
          <option value="1.0" selected>1.0x Normal</option>
          <option value="1.25">1.25x Fast</option>
          <option value="1.5">1.5x Very Fast</option>
          <option value="2.0">2.0x Double</option>
        </select>
      </section>

      <!-- Live Action Status -->
      <div id="status" role="status" aria-live="polite">Ready</div>

      <!-- Book / OCR Content Box -->
      <textarea id="content-box" aria-label="Reader content text area" placeholder="Your PDF content, scanned page text, or notes appear here...">Welcome to Accessible AI Reading & OCR Hub.

• Use 'Open PDF / Book' to load any PDF or text file.
• Use 'Scan / OCR Image' to extract text from a photo.
• Tap 'Read Aloud' to listen to the text.</textarea>

      <!-- Playback Actions -->
      <section class="playback-bar" aria-label="Playback controls">
        <button class="btn-speak" id="btn-read" aria-label="Read Aloud">▶ Read Aloud</button>
        <button id="btn-stop" aria-label="Stop Reading">⏹ Stop</button>
        <button id="btn-clear" aria-label="Clear Text">✖ Clear</button>
      </section>
    </main>
  </div>

  <script>
    // Configure PDF.js Worker
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    // Live Date and Time Updater
    function updateLiveDateTime() {
      const now = new Date();
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };

      const dateEl = document.getElementById('current-date');
      const timeEl = document.getElementById('current-time');

      if (dateEl) dateEl.textContent = now.toLocaleDateString(undefined, dateOptions);
      if (timeEl) timeEl.textContent = now.toLocaleTimeString(undefined, timeOptions);
    }
    setInterval(updateLiveDateTime, 1000);
    updateLiveDateTime();

    // Welcome Screen Next Button Handler
    const welcomeModal = document.getElementById('welcome-modal');
    const mainApp = document.getElementById('main-app');
    const btnNext = document.getElementById('btn-next');

    btnNext.addEventListener('click', () => {
      welcomeModal.style.display = 'none';
      mainApp.style.display = 'block';
      // Initialize speech synthesis voices on first user click
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
    });

    // Elements
    const contentBox = document.getElementById('content-box');
    const statusEl = document.getElementById('status');
    const speedSelect = document.getElementById('speed-select');
    const btnRead = document.getElementById('btn-read');
    const btnStop = document.getElementById('btn-stop');
    const btnClear = document.getElementById('btn-clear');
    const docInput = document.getElementById('doc-input');
    const imgInput = document.getElementById('img-input');

    // Speech Synthesis
    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      statusEl.textContent = 'Stopped.';
    }

    function readText() {
      if (!('speechSynthesis' in window)) {
        statusEl.textContent = 'Text-to-Speech is not supported on this device.';
        return;
      }
      stopSpeech();

      const text = contentBox.value.trim();
      if (!text) {
        statusEl.textContent = 'The reading area is empty.';
        return;
      }

      // Small delay to ensure Android TTS clears the cancellation state
      setTimeout(() => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = parseFloat(speedSelect.value) || 1.0;
        utterance.pitch = 1.0;

        utterance.onstart = () => {
          statusEl.textContent = 'Reading aloud...';
        };
        utterance.onend = () => {
          statusEl.textContent = 'Finished reading.';
        };
        utterance.onerror = (e) => {
          console.error('TTS error:', e);
          statusEl.textContent = 'Playback finished.';
        };

        window.speechSynthesis.speak(utterance);
      }, 50);
    }

    btnRead.addEventListener('click', readText);
    btnStop.addEventListener('click', stopSpeech);
    btnClear.addEventListener('click', () => {
      stopSpeech();
      contentBox.value = '';
      statusEl.textContent = 'Cleared.';
    });

    // PDF and TXT File Reader
    docInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopSpeech();
      const fileName = file.name.toLowerCase();

      if (fileName.endsWith('.txt')) {
        statusEl.textContent = 'Loading text file...';
        const reader = new FileReader();
        reader.onload = (event) => {
          contentBox.value = event.target.result;
          statusEl.textContent = `Loaded ${file.name}`;
          readText();
        };
        reader.readAsText(file);
      } else if (fileName.endsWith('.pdf') || file.type === 'application/pdf') {
        statusEl.textContent = 'Reading PDF...';
        try {
          const fileReader = new FileReader();
          fileReader.onload = async function() {
            try {
              const typedarray = new Uint8Array(this.result);
              const pdf = await pdfjsLib.getDocument({ data: typedarray }).promise;
              let fullText = '';
              for (let i = 1; i <= pdf.numPages; i++) {
                statusEl.textContent = `Extracting page ${i} of ${pdf.numPages}...`;
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageString = textContent.items.map(item => item.str).join(' ');
                fullText += `--- Page ${i} ---\n` + pageString + '\n\n';
              }
              contentBox.value = fullText.trim() ? fullText : 'This PDF appears to be a scanned image without selectable text. Use Scan / OCR Image instead.';
              statusEl.textContent = `Loaded PDF (${pdf.numPages} pages).`;
              readText();
            } catch (err) {
              console.error(err);
              statusEl.textContent = 'Could not parse PDF pages.';
            }
          };
          fileReader.readAsArrayBuffer(file);
        } catch (err) {
          console.error(err);
          statusEl.textContent = 'Error opening PDF file.';
        }
      }
    });

    // Tesseract OCR Reader
    imgInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      stopSpeech();
      statusEl.textContent = 'Initializing OCR engine...';

      try {
        const result = await Tesseract.recognize(file, 'eng', {
          logger: (progress) => {
            if (progress.status === 'recognizingtext') {
              const pct = Math.round((progress.progress || 0) * 100);
              statusEl.textContent = `Scanning document: ${pct}%`;
            } else if (progress.status) {
              statusEl.textContent = `${progress.status}...`;
            }
          }
        });

        const recognizedText = result && result.data ? result.data.text : '';
        if (recognizedText && recognizedText.trim().length > 0) {
          contentBox.value = recognizedText;
          statusEl.textContent = 'OCR extraction complete!';
          readText();
        } else {
          statusEl.textContent = 'No readable text was detected in the image.';
        }
      } catch (err) {
        console.error('OCR Error:', err);
        statusEl.textContent = 'Failed to recognize text from image.';
      }
    });
  </script>
</body>
</html>
