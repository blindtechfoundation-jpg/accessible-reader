name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Accessible Reader Release APK
        run: |
          set -e
          # 1. Create clean project
          flutter create --org com.saifulla --project-name accessible_reader app
          cd app

          # 2. Add stable accessibility & pure-dart PDF reader packages
          flutter pub add flutter_tts file_picker syncfusion_flutter_pdf

          # 3. Add storage permissions to AndroidManifest
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

          # 4. Safe Gradle config
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +

          # Disable code shrinker to avoid release crashes
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/release {/a \            isMinifyEnabled = false\n            isShrinkResources = false' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/release {/a \            minifyEnabled false\n            shrinkResources false' android/app/build.gradle
          fi

          # 5. Full Accessible Reader Code
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/semantics.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';

          void main() {
            runApp(const AccessibleReaderApp());
          }

          class AccessibleReaderApp extends StatelessWidget {
            const AccessibleReaderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Accessible Reader',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF101010),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFC107),
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const ReaderHomeScreen(),
              );
            }
          }

          class ReaderHomeScreen extends StatefulWidget {
            const ReaderHomeScreen({super.key});

            @override
            State<ReaderHomeScreen> createState() => _ReaderHomeScreenState();
          }

          class _ReaderHomeScreenState extends State<ReaderHomeScreen> {
            final FlutterTts _tts = FlutterTts();
            final TextEditingController _textController = TextEditingController();

            bool _isSpeaking = false;
            double _fontSize = 22.0;
            double _speechRate = 0.5;

            @override
            void initState() {
              super.initState();
              _initTts();
              _loadWelcomeMessage();
            }

            void _loadWelcomeMessage() {
              _textController.text =
                  "Welcome to Accessible Reader, developed by Saifulla.\n\n"
                  "Features included in this app:\n"
                  "1. Open PDF & Book: Tap the button at the top to load any PDF book or TXT document.\n"
                  "2. Text-to-Speech: Tap 'Read Aloud' to listen to any text or book chapter.\n"
                  "3. Font Size: Use the plus (+) and minus (-) buttons on the top bar to adjust text size.\n"
                  "4. Speed Control: Tap the speed icon on the top bar to choose between slow, normal, or fast reading.\n"
                  "5. Type or paste your own notes directly into this box at any time.";
            }

            void _initTts() {
              _tts.setStartHandler(() => setState(() => _isSpeaking = true));
              _tts.setCompletionHandler(() => setState(() => _isSpeaking = false));
              _tts.setErrorHandler((msg) => setState(() => _isSpeaking = false));
              _tts.setSpeechRate(_speechRate);
            }

            Future<void> _speak() async {
              if (_textController.text.trim().isNotEmpty) {
                await _tts.stop();
                await _tts.setSpeechRate(_speechRate);
                await _tts.speak(_textController.text);
              }
            }

            Future<void> _stop() async {
              await _tts.stop();
              setState(() => _isSpeaking = false);
            }

            Future<void> _pickBookFile() async {
              try {
                FilePickerResult? result = await FilePicker.platform.pickFiles(
                  type: FileType.custom,
                  allowedExtensions: ['pdf', 'txt'],
                );

                if (result != null && result.files.single.path != null) {
                  File file = File(result.files.single.path!);
                  String ext = result.files.single.extension?.toLowerCase() ?? '';

                  if (ext == 'pdf') {
                    final PdfDocument doc = PdfDocument(inputBytes: await file.readAsBytes());
                    String extracted = PdfTextExtractor(doc).extractText();
                    doc.dispose();

                    setState(() {
                      _textController.text = extracted.isNotEmpty
                          ? extracted
                          : "This PDF contains scanned images. Standard text could not be extracted.";
                    });
                  } else {
                    String content = await file.readAsString();
                    setState(() {
                      _textController.text = content;
                    });
                  }
                  _speak();
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Error opening file: $e')),
                );
              }
            }

            void _adjustFontSize(double change) {
              setState(() {
                _fontSize = (_fontSize + change).clamp(16.0, 36.0);
              });
            }

            void _setRate(double rate) {
              setState(() {
                _speechRate = rate;
              });
              _tts.setSpeechRate(rate);
            }

            @override
            void dispose() {
              _tts.stop();
              _textController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Accessible Reader'),
                  centerTitle: true,
                  backgroundColor: Colors.black,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.remove, semanticLabel: 'Decrease Font Size'),
                      onPressed: () => _adjustFontSize(-2.0),
                    ),
                    IconButton(
                      icon: const Icon(Icons.add, semanticLabel: 'Increase Font Size'),
                      onPressed: () => _adjustFontSize(2.0),
                    ),
                    PopupMenuButton<double>(
                      icon: const Icon(Icons.speed, semanticLabel: 'Reading Speed'),
                      onSelected: _setRate,
                      itemBuilder: (context) => [
                        const PopupMenuItem(value: 0.35, child: Text('0.7x Slow')),
                        const PopupMenuItem(value: 0.5, child: Text('1.0x Normal')),
                        const PopupMenuItem(value: 0.75, child: Text('1.5x Fast')),
                        const PopupMenuItem(value: 1.0, child: Text('2.0x Very Fast')),
                      ],
                    ),
                  ],
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(vertical: 8),
                        color: Colors.black26,
                        child: const Text(
                          'Developed by Saifulla',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            color: Color(0xFFFFC107),
                            fontWeight: FontWeight.bold,
                            fontSize: 16,
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16.0, vertical: 8.0),
                        child: Row(
                          children: [
                            Expanded(
                              child: ElevatedButton.icon(
                                onPressed: _pickBookFile,
                                icon: const Icon(Icons.folder_open, size: 24),
                                label: const Text('Open PDF / Book', style: TextStyle(fontSize: 16)),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF2A2A2A),
                                  foregroundColor: Colors.white,
                                  padding: const EdgeInsets.symmetric(vertical: 14),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 16.0),
                          child: Semantics(
                            label: 'Book text reader surface',
                            child: TextField(
                              controller: _textController,
                              maxLines: null,
                              expands: true,
                              keyboardType: TextInputType.multiline,
                              style: TextStyle(fontSize: _fontSize, height: 1.6, color: Colors.white),
                              decoration: InputDecoration(
                                filled: true,
                                fillColor: const Color(0xFF1E1E1E),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(12),
                                  borderSide: const BorderSide(color: Color(0xFFFFC107), width: 2),
                                ),
                                hintText: 'Book content appears here...',
                              ),
                            ),
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Row(
                          children: [
                            Expanded(
                              flex: 2,
                              child: ElevatedButton.icon(
                                onPressed: _isSpeaking ? _stop : _speak,
                                icon: Icon(_isSpeaking ? Icons.stop : Icons.play_arrow, size: 30),
                                label: Text(
                                  _isSpeaking ? 'Stop' : 'Read Aloud',
                                  style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold),
                                ),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFFFC107),
                                  foregroundColor: Colors.black,
                                  padding: const EdgeInsets.symmetric(vertical: 16),
                                ),
                              ),
                            ),
                            const SizedBox(width: 12),
                            OutlinedButton.icon(
                              onPressed: () {
                                _stop();
                                _textController.clear();
                              },
                              icon: const Icon(Icons.clear, size: 26),
                              label: const Text('Clear', style: TextStyle(fontSize: 18)),
                              style: OutlinedButton.styleFrom(
                                foregroundColor: Colors.white,
                                side: const BorderSide(color: Colors.white54),
                                padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 16),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 6. Build fast Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Accessible Reader APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*release*.apk
          
