name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Accessible Reader APK
        run: |
          set -e
          # 1. Create clean project
          flutter create --org com.saifulla --project-name accessible_reader app
          cd app

          # 2. Add stable TTS engine
          flutter pub add flutter_tts

          # 3. Create full Accessible Reader app
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter/semantics.dart';
          import 'package:flutter_tts/flutter_tts.dart';

          void main() {
            runApp(const AccessibleReaderApp());
          }

          class AccessibleReaderApp extends StatelessWidget {
            const AccessibleReaderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Accessible Reader',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF121212),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFC107),
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const ReaderHomeScreen(),
              );
            }
          }

          class ReaderHomeScreen extends StatefulWidget {
            const ReaderHomeScreen({super.key});

            @override
            State<ReaderHomeScreen> createState() => _ReaderHomeScreenState();
          }

          class _ReaderHomeScreenState extends State<ReaderHomeScreen> {
            final FlutterTts _tts = FlutterTts();
            final TextEditingController _textController = TextEditingController();

            bool _isSpeaking = false;
            double _fontSize = 22.0;
            double _speechRate = 0.5;

            final Map<String, String> _library = {
              "Welcome Guide":
                  "Welcome to Accessible Reader, developed by Saifulla. This app is designed for complete accessibility. You can listen to any text read aloud, adjust the reading speed from the top menu, increase or decrease the font size for comfortable reading, or choose pre-loaded books from the library.",
              "The Art of Thinking":
                  "Chapter 1: The Foundation of Thought. Clear thinking requires patience and focus. When reading or studying, taking moments to absorb the core idea helps build deep understanding.",
              "Science and Discovery":
                  "Chapter 1: Looking into the Universe. Throughout human history, curiosity has been the driving force behind every major breakthrough, from early tools to space exploration."
            };

            @override
            void initState() {
              super.initState();
              _initTts();
              _textController.text = _library["Welcome Guide"]!;
            }

            void _initTts() {
              _tts.setStartHandler(() => setState(() => _isSpeaking = true));
              _tts.setCompletionHandler(() => setState(() => _isSpeaking = false));
              _tts.setErrorHandler((msg) => setState(() => _isSpeaking = false));
              _tts.setSpeechRate(_speechRate);
            }

            Future<void> _speak() async {
              if (_textController.text.trim().isNotEmpty) {
                await _tts.stop();
                await _tts.setSpeechRate(_speechRate);
                await _tts.speak(_textController.text);
              }
            }

            Future<void> _stop() async {
              await _tts.stop();
              setState(() => _isSpeaking = false);
            }

            void _changeSpeed(double rate) {
              setState(() => _speechRate = rate);
              _tts.setSpeechRate(rate);
            }

            void _adjustFontSize(double change) {
              setState(() {
                _fontSize = (_fontSize + change).clamp(16.0, 36.0);
              });
            }

            void _openBook(String title) {
              _stop();
              setState(() {
                _textController.text = _library[title] ?? '';
              });
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('Loaded: $title')),
              );
            }

            @override
            void dispose() {
              _tts.stop();
              _textController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Accessible Reader'),
                  centerTitle: true,
                  backgroundColor: Colors.black,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.text_decrease, semanticLabel: 'Decrease Font Size'),
                      onPressed: () => _adjustFontSize(-2.0),
                    ),
                    IconButton(
                      icon: const Icon(Icons.text_increase, semanticLabel: 'Increase Font Size'),
                      onPressed: () => _adjustFontSize(2.0),
                    ),
                    PopupMenuButton<double>(
                      icon: const Icon(Icons.speed, semanticLabel: 'Reading Speed'),
                      onSelected: _changeSpeed,
                      itemBuilder: (context) => const [
                        PopupMenuItem(value: 0.35, child: Text('0.7x Slow')),
                        PopupMenuItem(value: 0.5, child: Text('1.0x Normal')),
                        PopupMenuItem(value: 0.75, child: Text('1.5x Fast')),
                        PopupMenuItem(value: 1.0, child: Text('2.0x Very Fast')),
                      ],
                    ),
                  ],
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(vertical: 8),
                        color: Colors.black26,
                        child: const Text(
                          'Developed by Saifulla',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            color: Color(0xFFFFC107),
                            fontWeight: FontWeight.bold,
                            fontSize: 16,
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 14.0, vertical: 8.0),
                        child: Row(
                          children: [
                            Expanded(
                              child: PopupMenuButton<String>(
                                onSelected: _openBook,
                                child: Container(
                                  padding: const EdgeInsets.symmetric(vertical: 14),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF2A2A2A),
                                    borderRadius: BorderRadius.circular(8),
                                  ),
                                  child: const Row(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Icon(Icons.menu_book, color: Color(0xFFFFC107)),
                                      SizedBox(width: 8),
                                      Text('Select Book / Chapter', style: TextStyle(fontSize: 16)),
                                    ],
                                  ),
                                ),
                                itemBuilder: (context) => _library.keys
                                    .map((title) => PopupMenuItem(
                                          value: title,
                                          child: Text(title),
                                        ))
                                    .toList(),
                              ),
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 14.0),
                          child: Semantics(
                            label: 'Reading text content',
                            child: TextField(
                              controller: _textController,
                              maxLines: null,
                              expands: true,
                              keyboardType: TextInputType.multiline,
                              style: TextStyle(fontSize: _fontSize, height: 1.6, color: Colors.white),
                              decoration: InputDecoration(
                                filled: true,
                                fillColor: const Color(0xFF1E1E1E),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(12),
                                  borderSide: const BorderSide(color: Color(0xFFFFC107), width: 2),
                                ),
                                hintText: 'Book or document content appears here...',
                              ),
                            ),
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.all(14.0),
                        child: Row(
                          children: [
                            Expanded(
                              flex: 2,
                              child: ElevatedButton.icon(
                                onPressed: _isSpeaking ? _stop : _speak,
                                icon: Icon(_isSpeaking ? Icons.stop : Icons.play_arrow, size: 30),
                                label: Text(
                                  _isSpeaking ? 'Stop' : 'Read Aloud',
                                  style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold),
                                ),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFFFC107),
                                  foregroundColor: Colors.black,
                                  padding: const EdgeInsets.symmetric(vertical: 16),
                                ),
                              ),
                            ),
                            const SizedBox(width: 12),
                            OutlinedButton.icon(
                              onPressed: () {
                                _stop();
                                _textController.clear();
                              },
                              icon: const Icon(Icons.clear, size: 26),
                              label: const Text('Clear', style: TextStyle(fontSize: 18)),
                              style: OutlinedButton.styleFrom(
                                foregroundColor: Colors.white,
                                side: const BorderSide(color: Colors.white54),
                                padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 16),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 4. Build standard APK without crashing
          flutter build apk --debug

      - name: Upload Accessible Reader APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
