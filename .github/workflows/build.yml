name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Project
        run: |
          flutter create --org com.accessiblereader --project-name accessible_reader app
          cd app
          flutter pub add flutter_tts image_picker google_mlkit_text_recognition share_plus path_provider

      - name: Configure Android
        run: |
          # Ensure minSdk is 21 for ML Kit compatibility
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' app/android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' app/android/app/build.gradle* || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' app/android/app/build.gradle* || true

          # Add Camera and Storage permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' app/android/app/src/main/AndroidManifest.xml

          # Copy main code
          if [ -f main.dart ]; then
            cp main.dart app/lib/main.dart
          fi

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
