name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Accessible Reader APK
        run: |
          # 1. Initialize project
          flutter create --org com.saifulla --project-name accessible_reader app
          cd app

          # 2. Add dependencies
          flutter pub add flutter_tts image_picker google_mlkit_text_recognition share_plus path_provider

          # 3. Add Android permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # 4. Safe Gradle configuration: Set minSdk 21 and compileSdk 34 cleanly
          python3 - << 'EOF'
          import os, re
          for root, _, files in os.walk('android'):
              for f in files:
                  if f.startswith('build.gradle'):
                      path = os.path.join(root, f)
                      with open(path, 'r') as fp:
                          content = fp.read()
                      content = re.sub(r'minSdk(Version)?\s*=?\s*(\S+)', r'minSdk = 21' if '.kts' in f else r'minSdkVersion 21', content)
                      content = re.sub(r'compileSdk(Version)?\s*=?\s*(\S+)', r'compileSdk = 34' if '.kts' in f else r'compileSdkVersion 34', content)
                      content = re.sub(r'targetSdk(Version)?\s*=?\s*(\S+)', r'targetSdk = 34' if '.kts' in f else r'targetSdkVersion 34', content)
                      with open(path, 'w') as fp:
                          fp.write(content)
          EOF

          # 5. Copy custom app code
          if [ -f ../main.dart ]; then
            cp ../main.dart lib/main.dart
          fi

          # 6. Build debug APK and log everything to file
          flutter build apk --debug -v > ../build-error-log.txt 2>&1 || {
            echo "BUILD COMPLETED WITH ERROR"
            tail -n 100 ../build-error-log.txt
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk

      - name: Upload Build Log Text
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-error-log
          path: build-error-log.txt
          
