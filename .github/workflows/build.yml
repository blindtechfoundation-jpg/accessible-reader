name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build One-Time Auto-Updating APK
        run: |
          set -e
          # 1. Create fresh app
          flutter create --org com.saifulla --project-name accessible_reader app
          cd app

          # 2. Add webview
          flutter pub add webview_flutter

          # 3. Add Android internet and camera/file permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # 4. Write WebView loader pointing to your live GitHub Pages
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AccessibleReaderApp());
          }

          class AccessibleReaderApp extends StatelessWidget {
            const AccessibleReaderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                title: 'Accessible Reader',
                debugShowCheckedModeBanner: false,
                home: ReaderWebShell(),
              );
            }
          }

          class ReaderWebShell extends StatefulWidget {
            const ReaderWebShell({super.key});

            @override
            State<ReaderWebShell> createState() => _ReaderWebShellState();
          }

          class _ReaderWebShellState extends State<ReaderWebShell> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF121212))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageStarted: (String url) {
                      setState(() => _isLoading = true);
                    },
                    onPageFinished: (String url) {
                      setState(() => _isLoading = false);
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://blindtechfoundation-jpg.github.io/accessible-reader/'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF121212),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(
                            color: Color(0xFFFFC107),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 5. Build native APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Accessible Reader APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
