name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Project
        run: |
          flutter create --org com.accessiblereader --project-name accessible_reader app
          cd app
          flutter pub add flutter_tts image_picker google_mlkit_text_recognition share_plus path_provider

      - name: Patch Android Configuration
        run: |
          # Set compileSdkVersion and targetSdkVersion to 34, minSdk to 21
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' app/android/app/build.gradle || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' app/android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' app/android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' app/android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' app/android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' app/android/app/build.gradle || true
          
          # Enable MultiDex
          sed -i '/defaultConfig {/a \        multiDexEnabled true' app/android/app/build.gradle || true

          # Inject Camera and Storage Permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' app/android/app/src/main/AndroidManifest.xml

          # Copy root main.dart into the Flutter project
          if [ -f main.dart ]; then
            cp main.dart app/lib/main.dart
          fi

      - name: Build Release APK
        run: |
          cd app
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
