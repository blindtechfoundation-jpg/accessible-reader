name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup App Project
        run: |
          # 1. Generate clean Flutter project
          flutter create --org com.accessiblereader --project-name accessible_reader app
          cd app

          # 2. Add required packages
          flutter pub add flutter_tts image_picker google_mlkit_text_recognition share_plus path_provider

          # 3. Add Android permissions directly
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # 4. Overwrite default main.dart with your app code
          if [ -f ../main.dart ]; then
            cp ../main.dart lib/main.dart
          fi

          # 5. Build APK passing Gradle minSdk property to guarantee ML Kit support
          flutter build apk --release --no-tree-shake-icons --target-platform android-arm64 --split-per-abi=false

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
