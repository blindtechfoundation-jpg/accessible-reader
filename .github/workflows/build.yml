name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Accessible Reader APK
        run: |
          set -e
          echo "=== 1. Creating Accessible Reader Flutter App ==="
          flutter create --org com.saifulla --project-name accessible_reader app
          cd app

          echo "=== 2. Adding Required Packages ==="
          flutter pub add flutter_tts image_picker google_mlkit_text_recognition share_plus path_provider

          echo "=== 3. Adding Permissions to AndroidManifest ==="
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          echo "=== 4. Setting Android SDK compatibility ==="
          # Support both Groovy (.gradle) and Kotlin (.gradle.kts)
          find android -type f -name "*build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android -type f -name "*build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +
          find android -type f -name "*build.gradle*" -exec sed -i 's/targetSdk = .*/targetSdk = 34/g' {} +
          find android -type f -name "*build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +
          find android -type f -name "*build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' {} +

          echo "=== 5. Copying Main Dart Source ==="
          if [ -f ../main.dart ]; then
            cp ../main.dart lib/main.dart
          fi

          echo "=== 6. Building APK ==="
          # Debug build guarantees 0% R8 shrinking crashes and installs immediately
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
