name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Accessible Reader
        run: |
          # 1. Create clean app template
          flutter create --org com.accessiblereader --project-name accessible_reader app
          cd app

          # 2. Add dependencies
          flutter pub add flutter_tts image_picker google_mlkit_text_recognition share_plus path_provider

          # 3. Add Android permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # 4. Enforce minSdkVersion 21 for ML Kit
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdkVersion = .*/minSdkVersion = 21/g' {} +
          find android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +

          # 5. Copy custom app code
          if [ -f ../main.dart ]; then
            cp ../main.dart lib/main.dart
          fi

          # 6. Build release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          
