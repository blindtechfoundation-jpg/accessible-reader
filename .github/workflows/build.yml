name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Full Accessible Reader Release APK
        run: |
          set -e
          # 1. Initialize project
          flutter create --org com.saifulla --project-name accessible_reader app
          cd app

          # 2. Add stable accessibility, file picking, and OCR packages
          flutter pub add flutter_tts file_picker image_picker google_mlkit_text_recognition syncfusion_flutter_pdf

          # 3. Add Android permissions for Camera and File access
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

          # 4. Configure SDK versions cleanly for modern Android
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android -type f \( -name "*build.gradle*" \) -exec sed -i 's/compileSdk = .*/compileSdk = 34/g' {} +

          # 5. Disable code shrinking to ensure ML Kit & PDF plugins build reliably
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/release {/a \            isMinifyEnabled = false\n            isShrinkResources = false' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/release {/a \            minifyEnabled false\n            shrinkResources false' android/app/build.gradle
          fi

          # 6. Inject Full-Featured Accessible Reader App
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/semantics.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:google_mlkit_text_recognition/google_mlkit_text_recognition.dart';
          import 'package:syncfusion_flutter_pdf/pdf.dart';

          void main() {
            runApp(const AccessibleReaderApp());
          }

          class AccessibleReaderApp extends StatelessWidget {
            const AccessibleReaderApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Accessible Reader',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF101010),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFC107),
                    surface: Color(0xFF1E1E1E),
                  ),
                ),
                home: const ReaderHomeScreen(),
              );
            }
          }

          class ReaderHomeScreen extends StatefulWidget {
            const ReaderHomeScreen({super.key});

            @override
            State<ReaderHomeScreen> createState() => _ReaderHomeScreenState();
          }

          class _ReaderHomeScreenState extends State<ReaderHomeScreen> {
            final FlutterTts _tts = FlutterTts();
            final TextEditingController _textController = TextEditingController();
            final ImagePicker _picker = ImagePicker();

            bool _isSpeaking = false;
            double _speechRate = 0.5;

            @override
            void initState() {
              super.initState();
              _initTts();
              _textController.text =
                  "Welcome to Accessible Reader, developed by Saifulla.\n\nTap 'Open Book / PDF' to read downloaded documents, or tap 'Scan Page' to use your camera and recognize printed text.";
            }

            void _initTts() {
              _tts.setStartHandler(() => setState(() => _isSpeaking = true));
              _tts.setCompletionHandler(() => setState(() => _isSpeaking = false));
              _tts.setErrorHandler((msg) => setState(() => _isSpeaking = false));
              _tts.setSpeechRate(_speechRate);
            }

            Future<void> _speak() async {
              if (_textController.text.trim().isNotEmpty) {
                await _tts.stop();
                await _tts.setSpeechRate(_speechRate);
                await _tts.speak(_textController.text);
              }
            }

            Future<void> _stop() async {
              await _tts.stop();
              setState(() => _isSpeaking = false);
            }

            Future<void> _pickDocument() async {
              try {
                FilePickerResult? result = await FilePicker.platform.pickFiles(
                  type: FileType.custom,
                  allowedExtensions: ['pdf', 'txt'],
                );

                if (result != null && result.files.single.path != null) {
                  File file = File(result.files.single.path!);
                  String ext = result.files.single.extension?.toLowerCase() ?? '';

                  if (ext == 'pdf') {
                    final PdfDocument document = PdfDocument(inputBytes: await file.readAsBytes());
                    String extractedText = PdfTextExtractor(document).extractText();
                    document.dispose();
                    setState(() {
                      _textController.text = extractedText.isNotEmpty
                          ? extractedText
                          : "This PDF contains scanned images instead of selectable text. Use Scan Page to read printed text.";
                    });
                  } else {
                    String content = await file.readAsString();
                    setState(() {
                      _textController.text = content;
                    });
                  }
                  _speak();
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Could not open file: $e')),
                );
              }
            }

            Future<void> _scanPage(ImageSource source) async {
              try {
                final XFile? photo = await _picker.pickImage(source: source);
                if (photo == null) return;

                final textRecognizer = TextRecognizer(script: TextRecognitionScript.latin);
                final inputImage = InputImage.fromFilePath(photo.path);
                final RecognizedText recognized = await textRecognizer.processImage(inputImage);
                await textRecognizer.close();

                if (recognized.text.trim().isNotEmpty) {
                  setState(() {
                    _textController.text = recognized.text;
                  });
                  _speak();
                } else {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text('No readable text found in image')),
                  );
                }
              } catch (e) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('Scan error: $e')),
                );
              }
            }

            void _changeSpeed(double rate) {
              setState(() {
                _speechRate = rate;
              });
              _tts.setSpeechRate(rate);
            }

            @override
            void dispose() {
              _tts.stop();
              _textController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Accessible Reader'),
                  centerTitle: true,
                  backgroundColor: Colors.black,
                  actions: [
                    PopupMenuButton<double>(
                      icon: const Icon(Icons.speed, semanticLabel: 'Reading Speed'),
                      onSelected: _changeSpeed,
                      itemBuilder: (context) => [
                        const PopupMenuItem(value: 0.35, child: Text('0.7x Slow')),
                        const PopupMenuItem(value: 0.5, child: Text('1.0x Normal')),
                        const PopupMenuItem(value: 0.75, child: Text('1.5x Fast')),
                        const PopupMenuItem(value: 1.0, child: Text('2.0x Very Fast')),
                      ],
                    ),
                  ],
                ),
                body: SafeArea(
                  child: Column(
                    children: [
                      Container(
                        width: double.infinity,
                        padding: const EdgeInsets.symmetric(vertical: 8),
                        color: Colors.black26,
                        child: const Text(
                          'Developed by Saifulla',
                          textAlign: TextAlign.center,
                          style: TextStyle(
                            color: Color(0xFFFFC107),
                            fontWeight: FontWeight.bold,
                            fontSize: 16,
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 16.0, vertical: 8.0),
                        child: Row(
                          children: [
                            Expanded(
                              child: ElevatedButton.icon(
                                onPressed: _pickDocument,
                                icon: const Icon(Icons.picture_as_pdf),
                                label: const Text('Open PDF', style: TextStyle(fontSize: 16)),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF2A2A2A),
                                  foregroundColor: Colors.white,
                                  padding: const EdgeInsets.symmetric(vertical: 14),
                                ),
                              ),
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: ElevatedButton.icon(
                                onPressed: () => _scanPage(ImageSource.camera),
                                icon: const Icon(Icons.camera_alt),
                                label: const Text('Scan Page', style: TextStyle(fontSize: 16)),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFF2A2A2A),
                                  foregroundColor: const Color(0xFFFFC107),
                                  padding: const EdgeInsets.symmetric(vertical: 14),
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      Expanded(
                        child: Padding(
                          padding: const EdgeInsets.all(16.0),
                          child: Semantics(
                            label: 'Reading text content',
                            child: TextField(
                              controller: _textController,
                              maxLines: null,
                              expands: true,
                              keyboardType: TextInputType.multiline,
                              style: const TextStyle(fontSize: 22, height: 1.6, color: Colors.white),
                              decoration: InputDecoration(
                                filled: true,
                                fillColor: const Color(0xFF1E1E1E),
                                border: OutlineInputBorder(
                                  borderRadius: BorderRadius.circular(12),
                                  borderSide: const BorderSide(color: Color(0xFFFFC107), width: 2),
                                ),
                                hintText: 'Book or document content appears here...',
                              ),
                            ),
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.all(16.0),
                        child: Row(
                          children: [
                            Expanded(
                              flex: 2,
                              child: ElevatedButton.icon(
                                onPressed: _isSpeaking ? _stop : _speak,
                                icon: Icon(_isSpeaking ? Icons.stop : Icons.play_arrow, size: 30),
                                label: Text(
                                  _isSpeaking ? 'Stop' : 'Read Aloud',
                                  style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold),
                                ),
                                style: ElevatedButton.styleFrom(
                                  backgroundColor: const Color(0xFFFFC107),
                                  foregroundColor: Colors.black,
                                  padding: const EdgeInsets.symmetric(vertical: 16),
                                ),
                              ),
                            ),
                            const SizedBox(width: 12),
                            OutlinedButton.icon(
                              onPressed: () {
                                _stop();
                                _textController.clear();
                              },
                              icon: const Icon(Icons.clear, size: 26),
                              label: const Text('Clear', style: TextStyle(fontSize: 18)),
                              style: OutlinedButton.styleFrom(
                                foregroundColor: Colors.white,
                                side: const BorderSide(color: Colors.white54),
                                padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 16),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 7. Build release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Accessible Reader APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessible-reader-release-apk
          path: app/build/app/outputs/flutter-apk/*release*.apk
          
